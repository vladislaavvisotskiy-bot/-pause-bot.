<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Маршрут PAUSE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/miniapp/static/styles.css?v=__STATIC_VERSION__">
</head>
<body>

<div id="app">

  <main id="content">

    <!-- ==================== МАРШРУТ ==================== -->
    <section id="screen-route" class="screen">
      <div id="route-header"></div>
      <div id="route-date-picker" class="date-pills"></div>
      <div id="courier-tabs" class="date-pills" hidden></div>
      <div id="route-start-badge" class="route-start-badge" hidden></div>

      <div id="map"></div>

      <div id="empty-state" class="empty-state" hidden>
        <p id="empty-state-text">На сегодня точек с заказами пока нет 🌿</p>
        <button id="retry-btn" class="btn-ghost" hidden>Повторить</button>
      </div>

      <div id="cards"></div>

      <button id="add-point-btn" class="btn-primary" hidden>+ Добавить точку</button>
    </section>

    <!-- ==================== ПРОФИЛЬ ==================== -->
    <section id="screen-profile" class="screen" hidden>
      <div id="profile-header"></div>
      <div id="profile-root"><div class="skeleton-block"></div></div>
    </section>

  </main>

  <nav id="bottom-nav">
    <button class="nav-item active" data-screen="route" aria-label="Маршрут">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="6" cy="6.5" r="2.3"/><circle cx="18" cy="17.5" r="2.3"/><path d="M6 8.8V13a4 4 0 0 0 4 4h4"/></svg>
      <span>Маршрут</span>
    </button>
    <button class="nav-item" data-screen="profile" aria-label="Профиль">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-3.8 4-5.6 7-5.6s5.8 1.8 7 5.6"/></svg>
      <span>Профиль</span>
    </button>
  </nav>

  <!-- Полноэкранный визард — подразделы Профиля (Мои доходы / Центр
       управления / Видимость маршрутов / Расходы на логистику), тот же
       каркас, что и в PAUSE App. -->
  <div id="wizard" class="wizard" hidden>
    <div class="wizard-head">
      <button id="wizard-back" class="wizard-back" aria-label="Назад">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div id="wizard-steps" class="wizard-steps"></div>
      <button id="wizard-close" class="wizard-close" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="wizard-body" class="wizard-body"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <div id="add-point-modal" class="modal" hidden>
    <div class="modal-sheet">
      <div class="modal-title">Добавить точку</div>
      <div id="add-point-list" class="modal-list"></div>
      <button id="add-point-cancel" class="btn-ghost">Отмена</button>
    </div>
  </div>

  <div id="courier-picker-modal" class="modal" hidden>
    <div class="modal-sheet">
      <div class="modal-title">Назначить курьеров</div>
      <div id="courier-picker-list" class="modal-list"></div>
      <button id="courier-picker-cancel" class="btn-ghost">Готово</button>
    </div>
  </div>

  <div id="cash-modal" class="modal" hidden>
    <div class="modal-sheet">
      <div class="modal-title" id="cash-modal-title">Наличные</div>
      <div id="cash-modal-body"></div>
      <button id="cash-modal-cancel" class="btn-ghost">Отмена</button>
    </div>
  </div>

  <div id="confirm-modal" class="modal" hidden>
    <div class="modal-sheet">
      <div class="modal-title" id="confirm-modal-title">Подтвердите действие</div>
      <p id="confirm-modal-text" class="modal-text"></p>
      <div class="modal-actions">
        <button id="confirm-modal-yes" class="btn-primary"></button>
        <button id="confirm-modal-no" class="btn-ghost">Отмена</button>
      </div>
    </div>
  </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="/miniapp/static/app.js?v=__STATIC_VERSION__"></script>
</body>
</html>
