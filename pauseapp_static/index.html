<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PAUSE App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pauseapp/static/styles.css">
</head>
<body>

<div id="app">

  <!-- Общей сплошной шапки на все экраны больше нет (на макете её нет —
       раньше здесь была тёмно-зелёная полоса поверх всего приложения).
       У каждого экрана своя шапка, повторяющая макет 1-в-1 — рисуется
       JS-ом в контейнер screen-header внутри самого экрана, см. app.js:
       renderScreenHeader(). -->
  <main id="content">

    <!-- ==================== ГЛАВНАЯ ==================== -->
    <section id="screen-home" class="screen">
      <div id="home-header"></div>
      <div id="home-root"><div class="skeleton-block"></div><div class="skeleton-block"></div><div class="skeleton-block"></div></div>
    </section>

    <!-- ==================== МЕНЮ ==================== -->
    <section id="screen-menu" class="screen" hidden>
      <div id="menu-header"></div>
      <div id="menu-root"><div class="skeleton-block"></div><div class="skeleton-block"></div><div class="skeleton-block"></div></div>
    </section>

    <!-- ==================== PAUSE CLUB ==================== -->
    <section id="screen-club" class="screen" hidden>
      <div id="club-header"></div>
      <button id="feed-compose-btn" class="btn-primary feed-compose-btn">Опубликовать</button>
      <div id="feed-filters" class="feed-filters"></div>
      <div id="feed-root"><div class="skeleton-block"></div><div class="skeleton-block"></div><div class="skeleton-block"></div></div>
    </section>

    <!-- ==================== ПОСЛАНИЯ ==================== -->
    <section id="screen-messages" class="screen" hidden>
      <div id="messages-header"></div>
      <div id="messages-feed-filters" class="feed-filters"></div>
      <div id="messages-feed-root"><div class="skeleton-block"></div><div class="skeleton-block"></div></div>
    </section>

    <!-- ==================== ПРОФИЛЬ ==================== -->
    <section id="screen-profile" class="screen" hidden>
      <div id="profile-header"></div>
      <div id="profile-root"><div class="skeleton-block"></div><div class="skeleton-block"></div></div>
    </section>

  </main>

  <nav id="bottom-nav">
    <button class="nav-item active" data-screen="home" aria-label="Главная">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9h12v-9"/></svg>
      <span>Главная</span>
    </button>
    <button class="nav-item" data-screen="menu" aria-label="Меню">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 10h8M8 14h5"/></svg>
      <span>Меню</span>
    </button>
    <button class="nav-item" data-screen="club" aria-label="Pause Club">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="5.5" cy="9.3" r="1.9"/><path d="M2.3 17 C2.3 13.8 3.6 12 5.5 12 C6.5 12 7.3 12.5 7.8 13.4"/><circle cx="18.5" cy="9.3" r="1.9"/><path d="M21.7 17 C21.7 13.8 20.4 12 18.5 12 C17.5 12 16.7 12.5 16.2 13.4"/><circle cx="12" cy="7.8" r="2.6"/><path d="M7.7 18 C7.7 14 9.4 11.6 12 11.6 C14.6 11.6 16.3 14 16.3 18"/></svg>
      <span>Pause Club</span>
    </button>
    <button class="nav-item" data-screen="messages" aria-label="Послания">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><path d="M4.5 7 12 12.5 19.5 7"/></svg>
      <span>Послания</span>
    </button>
    <button class="nav-item" data-screen="profile" aria-label="Профиль">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-3.8 4-5.6 7-5.6s5.8 1.8 7 5.6"/></svg>
      <span>Профиль</span>
    </button>
  </nav>

  <!-- Плавающая панель корзины — появляется, как только в заказе есть
       хоть одна позиция (см. app.js: syncCartBar). Идёт сразу следующим
       сиблингом после #bottom-nav — от этого зависит CSS-селектор
       #bottom-nav.nav-hidden ~ .cart-bar в styles.css. -->
  <div id="cart-bar" class="cart-bar" hidden></div>

  <!-- Приветственный экран — один раз, дальше запоминаем в localStorage
       этого устройства и не показываем повторно (см. app.js: SPLASH_KEY). -->
  <div id="splash" class="splash" hidden>
    <div class="splash-body">
      <div class="splash-logo">PAUSE.</div>
      <div class="splash-tagline"><span id="splash-tagline-1">more than lunch,</span><br><span id="splash-tagline-2">packed with care</span></div>
    </div>
    <button id="splash-start" class="btn-primary splash-start"></button>
  </div>

  <!-- Полноэкранный визард заказа -->
  <div id="wizard" class="wizard" hidden>
    <div class="wizard-head">
      <button id="wizard-back" class="wizard-back" aria-label="Назад">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div id="wizard-steps" class="wizard-steps"></div>
      <button id="wizard-close" class="wizard-close" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="wizard-body" class="wizard-body"></div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <div id="confirm-modal" class="modal" hidden>
    <div class="modal-sheet">
      <p id="confirm-modal-text" class="modal-text"></p>
      <div class="modal-actions">
        <button id="confirm-modal-yes" class="btn-primary"></button>
        <button id="confirm-modal-no" class="btn-ghost">Отмена</button>
      </div>
    </div>
  </div>

  <!-- Информационная плашка-модалка — статус клуба и т.п.: только
       "посмотреть", один вариант закрытия (в отличие от confirm-modal
       выше, где всегда два варианта). -->
  <div id="info-modal" class="modal" hidden>
    <div class="modal-sheet">
      <div id="info-modal-body" class="modal-text"></div>
      <div class="modal-actions">
        <button id="info-modal-ok" class="btn-primary">Понятно</button>
      </div>
    </div>
  </div>

</div>

<script src="/pauseapp/static/app.js"></script>
</body>
</html>
