<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PAUSE App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/pauseapp/static/styles.css">
</head>
<body>

<div id="app">

  <header id="header">
    <div class="brand">PAUSE</div>
    <div id="header-title">Меню</div>
  </header>

  <main id="content">

    <!-- ==================== МЕНЮ ==================== -->
    <section id="screen-menu" class="screen">
      <div id="menu-root"><div class="skeleton-block"></div><div class="skeleton-block"></div><div class="skeleton-block"></div></div>
    </section>

    <!-- ==================== PAUSE CLUB ==================== -->
    <section id="screen-club" class="screen" hidden>
      <div class="club-header">
        <h2>PAUSE CLUB</h2>
        <p>место, где можно немного остановиться</p>
      </div>
      <button id="feed-compose-btn" class="btn-gold feed-compose-btn">Опубликовать</button>
      <div id="feed-filters" class="feed-filters"></div>
      <div id="feed-root"><div class="skeleton-block"></div><div class="skeleton-block"></div><div class="skeleton-block"></div></div>
    </section>

    <!-- ==================== ПРОФИЛЬ ==================== -->
    <section id="screen-profile" class="screen" hidden>
      <div id="profile-root"><div class="skeleton-block"></div><div class="skeleton-block"></div></div>
    </section>

  </main>

  <nav id="bottom-nav">
    <button class="nav-item" data-screen="club" aria-label="PAUSE Club">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M12 3c-2 2.5-3 4.7-3 6.6A3 3 0 0 0 12 12a3 3 0 0 0 3-3.4C15 7.7 14 5.5 12 3Z"/><path d="M12 12v9"/></svg>
      <span>Club</span>
    </button>
    <button class="nav-item nav-item-main active" data-screen="menu" aria-label="Меню">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 10h8M8 14h5"/></svg>
      <span>Меню</span>
    </button>
    <button class="nav-item" data-screen="profile" aria-label="Профиль">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-3.8 4-5.6 7-5.6s5.8 1.8 7 5.6"/></svg>
      <span>Профиль</span>
    </button>
  </nav>

  <!-- Полноэкранный визард заказа -->
  <div id="wizard" class="wizard" hidden>
    <div class="wizard-head">
      <button id="wizard-back" class="wizard-back" aria-label="Назад">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <div id="wizard-steps" class="wizard-steps"></div>
      <button id="wizard-close" class="wizard-close" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="wizard-body" class="wizard-body"></div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <div id="confirm-modal" class="modal" hidden>
    <div class="modal-sheet">
      <p id="confirm-modal-text" class="modal-text"></p>
      <div class="modal-actions">
        <button id="confirm-modal-yes" class="btn-gold"></button>
        <button id="confirm-modal-no" class="btn-ghost">Отмена</button>
      </div>
    </div>
  </div>

</div>

<script src="/pauseapp/static/app.js"></script>
</body>
</html>
